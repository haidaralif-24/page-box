name: Render demo

# Manual render of page-box-demo on a GitHub-hosted runner.
# The recorded .mov takes (~200 MB) are too big for git, so they live on the
# `demo-footage-v1` prerelease and are downloaded at job time. The audio bed
# is synthesized deterministically by scripts/audio.mjs (pure Node).
# Output lands as a downloadable build artifact.

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "web = 540p + small file (README), full = 1080p"
        type: choice
        default: web
        options: [web, full]
      frames:
        description: "Optional frame range for a quick test, e.g. 520-610 (empty = whole video)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: render-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest # 4 vCPU / 16 GB, glibc >= 2.35
    timeout-minutes: 60
    defaults:
      run:
        working-directory: page-box-demo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: page-box-demo/pnpm-lock.yaml

      # Shared libraries Chrome Headless Shell needs on Ubuntu 24.04:
      # https://www.remotion.dev/docs/miscellaneous/linux-dependencies
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0 \
            fonts-liberation fonts-noto-color-emoji

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Chrome Headless Shell
        run: pnpm exec remotion browser ensure

      - name: Download recorded takes (release assets, not in git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download demo-footage-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern '*.mov' --dir public/videos --clobber
          ls -lh public/videos

      - name: Synthesize audio bed (deterministic, pure Node)
        run: pnpm audio

      - name: Render
        run: |
          args="--codec=h264 --x264-preset=veryfast --concurrency=4 --gl=swangle"
          if [ "${{ inputs.quality }}" = "web" ]; then
            # 0.5 -> exact 960x540. Fractional scales like 0.6667 produce
            # non-integer dimensions, which stitchFramesToVideo() rejects.
            args="$args --crf=28 --scale=0.5"
          else
            args="$args --crf=20"
          fi
          if [ -n "${{ inputs.frames }}" ]; then
            args="$args --frames=${{ inputs.frames }}"
          fi
          pnpm exec remotion render Demo out/pagebox-demo.mp4 $args

      - uses: actions/upload-artifact@v4
        with:
          name: pagebox-demo-${{ inputs.quality }}
          path: page-box-demo/out/pagebox-demo.mp4
          if-no-files-found: error
          retention-days: 14
